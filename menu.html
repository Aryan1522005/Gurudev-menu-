<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Hotel Gurudev - Menu</title>

    <!-- PDF.JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- OUR FOOD DATABASE -->
    <script src="menu-data.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #d5d5d5;
        }

        body {
            overflow: hidden;
        }


        /* =========================
           HEADER
        ========================= */

        .header {

            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            height: 116px;

            background: #2E7D32;

            z-index: 1000;

            box-shadow:
                0 3px 12px rgba(0,0,0,.30);

        }


        .header-top {

            height: 58px;

            display: flex;

            align-items: center;

            padding: 8px 12px;

        }


        .back-button {

            border: none;

            background: #FF9800;

            color: white;

            border-radius: 24px;

            padding: 10px 16px;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            white-space: nowrap;

        }


        .restaurant-name {

            color: white;

            font-size: 18px;

            font-weight: bold;

            margin-left: 12px;

            white-space: nowrap;

        }


        /* =========================
           SEARCH
        ========================= */

        .search-area {

            padding:
                4px
                12px
                10px;

        }


        .search-wrap {

            position: relative;

            width: 100%;

        }


        .search-icon {

            position: absolute;

            left: 16px;

            top: 50%;

            transform:
                translateY(-50%);

            font-size: 18px;

            pointer-events: none;

        }


        .search-input {

            width: 100%;

            height: 46px;

            border: none;

            outline: none;

            border-radius: 24px;

            padding:
                0
                45px;

            font-size: 16px;

            color: #222;

            background: white;

            box-shadow:
                0 2px 7px
                rgba(0,0,0,.25);

        }


        .search-input::placeholder {

            color: #888;

        }


        .clear-btn {

            position: absolute;

            right: 10px;

            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: #eeeeee;

            color: #666;

            width: 28px;

            height: 28px;

            border-radius: 50%;

            cursor: pointer;

            display: none;

        }


        /* =========================
           QUICK SEARCH
        ========================= */

        .quick-search {

            display: none;

            position: fixed;

            top: 116px;

            left: 0;

            right: 0;

            z-index: 950;

            background: white;

            padding: 12px 14px;

            box-shadow:
                0 4px 12px
                rgba(0,0,0,.20);

        }


        .quick-title {

            font-size: 12px;

            color: #777;

            font-weight: bold;

            margin-bottom: 8px;

        }


        .quick-chips {

            display: flex;

            gap: 7px;

            overflow-x: auto;

            scrollbar-width: none;

        }


        .quick-chips::-webkit-scrollbar {

            display: none;

        }


        .chip {

            flex: 0 0 auto;

            border:
                1px solid
                #c8dfca;

            background: #f2faf3;

            color: #2E7D32;

            border-radius: 18px;

            padding:
                7px
                12px;

            font-size: 12px;

            cursor: pointer;

        }


        /* =========================
           SEARCH RESULTS
        ========================= */

        .results-panel {

            display: none;

            position: fixed;

            top: 116px;

            left: 0;

            right: 0;

            z-index: 940;

            background: white;

            box-shadow:
                0 5px 16px
                rgba(0,0,0,.25);

            border-radius:
                0
                0
                14px
                14px;

            overflow: hidden;

        }


        .results-head {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding:
                11px
                15px
                8px;

            color: #777;

            font-size: 12px;

            font-weight: bold;

            border-bottom:
                1px solid
                #eeeeee;

        }


        .results-list {

            max-height:
                min(62vh, 520px);

            overflow-y: auto;

        }


        .result {

            display: flex;

            align-items: center;

            gap: 10px;

            padding:
                12px
                14px;

            border-bottom:
                1px solid
                #eeeeee;

            background: white;

            cursor: pointer;

        }


        .result:active {

            background: #f1f7f1;

        }


        .result-icon {

            width: 40px;

            height: 40px;

            flex:
                0 0 40px;

            display: grid;

            place-items: center;

            border-radius: 50%;

            background: #E8F5E9;

            font-size: 18px;

        }


        .result-main {

            min-width: 0;

            flex: 1;

        }


        .result-name {

            color: #222;

            font-size: 15px;

            font-weight: bold;

            line-height: 1.3;

        }


        .result-name mark {

            background: #FFE082;

            color: #111;

            border-radius: 3px;

            padding: 0 2px;

        }


        .result-meta {

            margin-top: 4px;

            color: #777;

            font-size: 12px;

        }


        .result-price {

            color: #2E7D32;

            font-size: 15px;

            font-weight: bold;

            white-space: nowrap;

        }


        .result-arrow {

            color: #999;

            font-size: 22px;

        }


        .no-results {

            padding: 30px 18px;

            text-align: center;

            color: #777;

        }


        .no-results-icon {

            font-size: 30px;

            margin-bottom: 7px;

        }


        .no-results-title {

            color: #444;

            font-weight: bold;

            margin-bottom: 5px;

        }


        .no-results-text {

            font-size: 12px;

        }


        /* =========================
           PDF CONTAINER
        ========================= */

        .pdf-container {

            position: absolute;

            top: 116px;

            left: 0;

            right: 0;

            bottom: 0;

            overflow-y: auto;

            padding:
                14px
                6px
                35px;

            background: #d0d0d0;

            -webkit-overflow-scrolling:
                touch;

        }


        .pdf-page {

            position: relative;

            width: 100%;

            max-width: 900px;

            margin:
                0
                auto
                14px;

            background: white;

            box-shadow:
                0 2px 10px
                rgba(0,0,0,.30);

            scroll-margin-top: 126px;

        }


        .pdf-page canvas {

            display: block;

            width: 100%;

            height: auto;

        }


        .page-number {

            position: absolute;

            right: 8px;

            bottom: 8px;

            padding:
                5px
                9px;

            border-radius: 15px;

            background:
                rgba(0,0,0,.55);

            color: white;

            font-size: 11px;

        }


        .page-found {

            animation:
                pulse
                1.5s
                ease;

        }


        @keyframes pulse {

            0% {

                outline:
                    5px
                    solid
                    #FF9800;

            }

            100% {

                outline:
                    0
                    solid
                    transparent;

            }

        }


        /* =========================
           LOADING
        ========================= */

        .loading {

            text-align: center;

            padding: 70px 20px;

            color: #555;

        }


        .spinner {

            width: 42px;

            height: 42px;

            margin:
                0
                auto
                15px;

            border:
                4px
                solid
                #ddd;

            border-top-color:
                #2E7D32;

            border-radius: 50%;

            animation:
                spin
                .8s
                linear
                infinite;

        }


        @keyframes spin {

            from {

                transform:
                    rotate(0);

            }

            to {

                transform:
                    rotate(360deg);

            }

        }


        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 701px) {

            .header {

                height: 70px;

                display: flex;

                align-items: center;

                padding: 0 15px;

            }


            .header-top {

                height: auto;

                padding: 0;

            }


            .search-area {

                flex: 1;

                max-width: 560px;

                margin-left: auto;

                padding: 0;

            }


            .search-input {

                height: 44px;

            }


            .results-panel {

                top: 70px;

                left: auto;

                right: 15px;

                width: 560px;

                border-radius:
                    0
                    0
                    14px
                    14px;

            }


            .quick-search {

                top: 70px;

            }


            .pdf-container {

                top: 70px;

            }

        }


        /* =========================
           SMALL PHONES
        ========================= */

        @media (max-width: 380px) {

            .restaurant-name {

                font-size: 16px;

                margin-left: 8px;

            }


            .back-button {

                padding:
                    8px
                    12px;

                font-size: 13px;

            }


            .search-input {

                font-size: 15px;

            }


            .result-name {

                font-size: 14px;

            }


            .result-price {

                font-size: 14px;

            }

        }

    </style>

</head>


<body>


<header class="header">

    <div class="header-top">

        <button
            class="back-button"
            onclick="goBack()">

            ← Back

        </button>


        <div class="restaurant-name">

            Hotel Gurudev

        </div>

    </div>


    <div class="search-area">

        <div class="search-wrap">

            <span class="search-icon">
                🔍
            </span>


            <input
                id="searchInput"
                class="search-input"
                type="search"
                placeholder="Search food items..."
                autocomplete="off"
                enterkeyhint="search">


            <button
                id="clearBtn"
                class="clear-btn"
                onclick="clearSearch()">

                ✕

            </button>

        </div>

    </div>

</header>



<div
    id="quickSearch"
    class="quick-search">

    <div class="quick-title">
        QUICK SEARCH
    </div>

    <div class="quick-chips">

        <button
            class="chip"
            data-search="paneer">
            Paneer
        </button>

        <button
            class="chip"
            data-search="dosa">
            Dosa
        </button>

        <button
            class="chip"
            data-search="rice">
            Rice
        </button>

        <button
            class="chip"
            data-search="biryani">
            Biryani
        </button>

        <button
            class="chip"
            data-search="chinese">
            Chinese
        </button>

        <button
            class="chip"
            data-search="milkshake">
            Milkshake
        </button>

    </div>

</div>



<div
    id="resultsPanel"
    class="results-panel">

    <div class="results-head">

        <span id="resultsCount">
            Search results
        </span>

        <span>
            Tap an item
        </span>

    </div>


    <div
        id="resultsList"
        class="results-list">

    </div>

</div>



<main
    id="pdfContainer"
    class="pdf-container">

    <div class="loading">

        <div class="spinner"></div>

        <div>
            Loading menu...
        </div>

    </div>

</main>



<script>

    /*
     * EXACT PDF FILE NAME IN YOUR GITHUB REPOSITORY
     */

    const PDF_URL =
        "New gurudev menucard bota.pdf";


    /*
     * PDF.JS WORKER
     */

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


    const searchInput =
        document.getElementById(
            "searchInput"
        );


    const clearBtn =
        document.getElementById(
            "clearBtn"
        );


    const resultsPanel =
        document.getElementById(
            "resultsPanel"
        );


    const resultsList =
        document.getElementById(
            "resultsList"
        );


    const resultsCount =
        document.getElementById(
            "resultsCount"
        );


    const quickSearch =
        document.getElementById(
            "quickSearch"
        );


    const pdfContainer =
        document.getElementById(
            "pdfContainer"
        );


    let pdfDocument = null;



    /*
     * NORMALIZE SEARCH TEXT
     */

    function normalize(text) {

        return String(text || "")

            .toLowerCase()

            .normalize("NFKD")

            .replace(
                /[’'`]/g,
                ""
            )

            .replace(
                /[^a-z0-9₹]+/g,
                " "
            )

            .replace(
                /\s+/g,
                " "
            )

            .trim();

    }



    /*
     * SEARCH SCORING
     */

    function scoreItem(item, query) {

        const q =
            normalize(query);

        if (!q) {
            return 0;
        }


        const name =
            normalize(item.name);


        const category =
            normalize(item.category);


        const aliases =
            (item.aliases || [])
            .map(normalize)
            .join(" ");


        const words =
            q.split(" ")
             .filter(Boolean);


        let score = 0;


        if (name === q) {
            score += 1000;
        }


        if (name.startsWith(q)) {
            score += 500;
        }


        if (name.includes(q)) {
            score += 300;
        }


        if (aliases.includes(q)) {
            score += 260;
        }


        if (category.includes(q)) {
            score += 80;
        }


        let matchedWords = 0;


        for (const word of words) {

            if (
                name.includes(word) ||
                aliases.includes(word)
            ) {

                matchedWords++;

            }

        }


        if (
            words.length &&
            matchedWords === words.length
        ) {

            score += 220;

        } else {

            score +=
                matchedWords * 35;

        }


        return score;

    }



    /*
     * SEARCH MENU ITEMS
     */

    function searchItems(query) {

        const q =
            normalize(query);


        if (!q) {
            return [];
        }


        return MENU_ITEMS

            .map(item => ({

                item: item,

                score:
                    scoreItem(
                        item,
                        q
                    )

            }))

            .filter(x =>
                x.score > 0
            )

            .sort((a, b) =>

                b.score -
                a.score ||

                a.item.name.localeCompare(
                    b.item.name
                )

            )

            .map(x =>
                x.item
            );

    }



    /*
     * HTML ESCAPE
     */

    function escapeHTML(text) {

        return String(text)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }



    /*
     * HIGHLIGHT SEARCH TERM
     */

    function highlightName(
        name,
        query
    ) {

        const safe =
            escapeHTML(name);


        const words =
            normalize(query)

            .split(" ")

            .filter(Boolean)

            .sort(
                (a, b) =>
                    b.length -
                    a.length
            );


        let html = safe;


        for (const word of words) {

            const escaped =
                word.replace(
                    /[.*+?^${}()|[\]\\]/g,
                    "\\$&"
                );


            html =
                html.replace(
                    new RegExp(
                        `(${escaped})`,
                        "gi"
                    ),
                    "<mark>$1</mark>"
                );

        }


        return html;

    }



    /*
     * SHOW SEARCH RESULTS
     */

    function showResults(query) {

        const q =
            normalize(query);


        clearBtn.style.display =
            q
                ? "block"
                : "none";


        /*
         * Empty search
         */

        if (!q) {

            resultsPanel.style.display =
                "none";

            quickSearch.style.display =
                "block";

            resultsList.innerHTML =
                "";

            return;

        }


        quickSearch.style.display =
            "none";


        const results =
            searchItems(q);


        resultsCount.textContent =

            results.length === 1

                ? "1 item found"

                : `${results.length} items found`;


        resultsList.innerHTML =
            "";


        /*
         * No results
         */

        if (!results.length) {

            resultsList.innerHTML = `

                <div class="no-results">

                    <div class="no-results-icon">
                        🔍
                    </div>

                    <div class="no-results-title">
                        No food item found
                    </div>

                    <div class="no-results-text">
                        Try Paneer, Dosa, Rice,
                        Biryani or Chinese.
                    </div>

                </div>

            `;


            resultsPanel.style.display =
                "block";


            return;

        }



        /*
         * Create result cards
         */

        results.forEach(item => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "result";


            row.innerHTML = `

                <div class="result-icon">
                    🍽️
                </div>


                <div class="result-main">

                    <div class="result-name">

                        ${highlightName(
                            item.name,
                            q
                        )}

                    </div>


                    <div class="result-meta">

                        ${escapeHTML(
                            item.category
                        )}

                        · Page

                        ${item.page}

                    </div>

                </div>


                <div class="result-price">

                    ₹${item.price}

                </div>


                <div class="result-arrow">

                    ›

                </div>

            `;



            /*
             * Clicking result
             */

            row.addEventListener(
                "click",
                () => {

                    goToPage(
                        item.page
                    );


                    resultsPanel.style.display =
                        "none";


                    quickSearch.style.display =
                        "none";


                    searchInput.blur();

                }
            );


            resultsList.appendChild(
                row
            );

        });


        resultsPanel.style.display =
            "block";

    }



    /*
     * GO TO PDF PAGE
     */

    function goToPage(
        pageNumber
    ) {

        const page =
            document.getElementById(
                `page-${pageNumber}`
            );


        if (!page) {
            return;
        }


        page.scrollIntoView({

            behavior: "smooth",

            block: "start"

        });


        page.classList.remove(
            "page-found"
        );


        void page.offsetWidth;


        page.classList.add(
            "page-found"
        );

    }



    /*
     * CLEAR SEARCH
     */

    function clearSearch() {

        searchInput.value =
            "";


        resultsPanel.style.display =
            "none";


        clearBtn.style.display =
            "none";


        quickSearch.style.display =
            "block";


        searchInput.focus();

    }



    /*
     * BACK BUTTON
     */

    function goBack() {

        window.location.href =
            "index.html";

    }



    /*
     * LOAD PDF
     */

    async function loadPDF() {

        try {

            pdfDocument =
                await pdfjsLib

                    .getDocument(
                        PDF_URL
                    )

                    .promise;


            pdfContainer.innerHTML =
                "";


            for (
                let pageNumber = 1;

                pageNumber <=
                pdfDocument.numPages;

                pageNumber++
            ) {

                await renderPage(
                    pageNumber
                );

            }


        } catch (error) {

            console.error(error);


            pdfContainer.innerHTML = `

                <div class="loading">

                    ❌ Unable to load menu.

                    <br><br>

                    Make sure the PDF filename is:

                    <br><br>

                    <strong>
                        New gurudev menucard bota.pdf
                    </strong>

                </div>

            `;

        }

    }



    /*
     * RENDER PDF PAGE
     */

    async function renderPage(
        pageNumber
    ) {

        const page =
            await pdfDocument.getPage(
                pageNumber
            );


        const viewport =
            page.getViewport({
                scale: 1.6
            });


        const pageDiv =
            document.createElement(
                "div"
            );


        pageDiv.className =
            "pdf-page";


        pageDiv.id =
            `page-${pageNumber}`;


        const canvas =
            document.createElement(
                "canvas"
            );


        const context =
            canvas.getContext(
                "2d"
            );


        canvas.width =
            viewport.width;


        canvas.height =
            viewport.height;


        pageDiv.appendChild(
            canvas
        );


        const pageNumberDiv =
            document.createElement(
                "div"
            );


        pageNumberDiv.className =
            "page-number";


        pageNumberDiv.textContent =
            `Page ${pageNumber}`;


        pageDiv.appendChild(
            pageNumberDiv
        );


        pdfContainer.appendChild(
            pageDiv
        );


        await page.render({

            canvasContext:
                context,

            viewport:
                viewport

        }).promise;

    }



    /*
     * SEARCH INPUT
     */

    searchInput.addEventListener(
        "input",
        () => {

            showResults(
                searchInput.value
            );

        }
    );



    /*
     * SEARCH FOCUS
     */

    searchInput.addEventListener(
        "focus",
        () => {

            if (
                !normalize(
                    searchInput.value
                )
            ) {

                quickSearch.style.display =
                    "block";

            }

        }
    );



    /*
     * QUICK SEARCH BUTTONS
     */

    document
        .querySelectorAll(".chip")
        .forEach(chip => {

            chip.addEventListener(
                "click",
                () => {

                    const value =
                        chip.dataset.search;


                    searchInput.value =
                        value;


                    showResults(
                        value
                    );


                    searchInput.focus();

                }
            );

        });



    /*
     * CLOSE SEARCH WHEN
     * CLICKING OUTSIDE
     */

    document.addEventListener(
        "click",
        event => {

            const insideSearch =
                event.target.closest(
                    ".search-area"
                );


            const insideResults =
                event.target.closest(
                    ".results-panel"
                );


            const insideQuick =
                event.target.closest(
                    ".quick-search"
                );


            if (
                !insideSearch &&
                !insideResults &&
                !insideQuick
            ) {

                resultsPanel.style.display =
                    "none";

                quickSearch.style.display =
                    "none";

            }

        }
    );



    /*
     * ESCAPE KEY
     */

    searchInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Escape"
            ) {

                clearSearch();

            }

        }
    );



    /*
     * START
     */

    loadPDF();

</script>


</body>

</html>
