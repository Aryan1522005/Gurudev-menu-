<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hotel Gurudev - Menu</title>


    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #eeeeee;
        }


        /* ========================================
           TOP BAR
        ======================================== */

        .topbar {

            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            height: 70px;

            background: #2E7D32;

            display: flex;
            align-items: center;

            padding: 10px 15px;

            z-index: 1000;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.3);

        }


        /* Back button */

        .back-btn {

            flex-shrink: 0;

            border: none;

            background: #FF9800;

            color: white;

            font-size: 15px;

            font-weight: 600;

            padding: 11px 16px;

            border-radius: 25px;

            cursor: pointer;

        }


        .back-btn:hover {

            background: #F57C00;

        }


        /* Restaurant name */

        .restaurant-name {

            color: white;

            font-size: 19px;

            font-weight: 600;

            margin-left: 15px;

            white-space: nowrap;

        }


        /* ========================================
           SEARCH
        ======================================== */

        .search-wrapper {

            flex: 1;

            max-width: 500px;

            margin-left: auto;

            margin-right: 15px;

            position: relative;

        }


        .search-box {

            width: 100%;

            height: 45px;

            padding:

                0 45px

                0 18px;

            border: none;

            border-radius: 25px;

            font-size: 15px;

            outline: none;

            box-shadow:
                0 2px 6px rgba(0,0,0,0.2);

        }


        .search-icon {

            position: absolute;

            right: 17px;

            top: 50%;

            transform: translateY(-50%);

            font-size: 19px;

            pointer-events: none;

        }


        /* ========================================
           SEARCH RESULTS
        ======================================== */

        .search-results {

            position: absolute;

            top: 50px;

            left: 0;

            right: 0;

            background: white;

            color: #333;

            border-radius: 10px;

            box-shadow:
                0 5px 15px rgba(0,0,0,0.3);

            max-height: 400px;

            overflow-y: auto;

            display: none;

            z-index: 2000;

        }


        .search-result {

            padding: 12px 15px;

            border-bottom:
                1px solid #eeeeee;

            cursor: pointer;

            text-align: left;

        }


        .search-result:last-child {

            border-bottom: none;

        }


        .search-result:hover {

            background: #f5f5f5;

        }


        .result-page {

            color: #2E7D32;

            font-size: 12px;

            font-weight: bold;

            margin-bottom: 4px;

        }


        .result-text {

            font-size: 14px;

            line-height: 1.4;

        }


        .no-result {

            padding: 15px;

            text-align: center;

            color: #777;

            font-size: 14px;

        }


        /* ========================================
           PDF AREA
        ======================================== */

        .pdf-container {

            position: absolute;

            top: 70px;

            left: 0;
            right: 0;
            bottom: 0;

            overflow-y: auto;

            padding: 25px 10px 40px;

            background: #d0d0d0;

        }


        /* Each PDF page */

        .pdf-page {

            position: relative;

            width: 100%;

            max-width: 900px;

            margin: 0 auto 25px auto;

            background: white;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.3);

        }


        .pdf-page canvas {

            display: block;

            width: 100%;

            height: auto;

        }


        /* Invisible text layer */

        .text-layer {

            position: absolute;

            top: 0;

            left: 0;

            right: 0;

            bottom: 0;

            overflow: hidden;

            line-height: 1;

            pointer-events: none;

        }


        .text-layer span {

            position: absolute;

            white-space: pre;

            transform-origin: 0% 0%;

            color: transparent;

            user-select: text;

        }


        /* Search highlight */

        .search-highlight {

            background: rgba(255, 193, 7, 0.55);

            border-radius: 3px;

        }


        /* ========================================
           LOADING
        ======================================== */

        .loading {

            text-align: center;

            padding: 60px 20px;

            color: #555;

            font-size: 16px;

        }


        .spinner {

            width: 40px;

            height: 40px;

            margin: 0 auto 15px;

            border:

                4px solid #ddd;

            border-top-color:

                #2E7D32;

            border-radius: 50%;

            animation:

                spin 0.8s linear infinite;

        }


        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }


        /* ========================================
           PAGE NUMBER
        ======================================== */

        .page-number {

            position: absolute;

            bottom: 8px;

            right: 10px;

            background:
                rgba(0,0,0,0.55);

            color: white;

            padding: 4px 8px;

            border-radius: 10px;

            font-size: 11px;

            z-index: 5;

        }


        /* ========================================
           MOBILE
        ======================================== */

        @media (max-width: 700px) {

            .topbar {

                height: 125px;

                flex-wrap: wrap;

                padding: 8px 10px;

            }


            .back-btn {

                font-size: 13px;

                padding: 9px 13px;

            }


            .restaurant-name {

                font-size: 16px;

                margin-left: 8px;

            }


            .search-wrapper {

                order: 3;

                width: 100%;

                max-width: none;

                margin:

                    7px 0 0 0;

            }


            .search-box {

                height: 42px;

            }


            .search-results {

                top: 47px;

            }


            .pdf-container {

                top: 125px;

                padding:

                    15px 5px 30px;

            }


            .pdf-page {

                margin-bottom: 15px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         TOP BAR
    ====================================== -->

    <div class="topbar">


        <button
            class="back-btn"
            onclick="goBack()"
        >
            ← Back
        </button>


        <div class="restaurant-name">
            Hotel Gurudev
        </div>


        <div class="search-wrapper">

            <input
                id="searchBox"
                class="search-box"
                type="text"
                placeholder="Search food items..."
                autocomplete="off"
            >

            <span class="search-icon">
                🔍
            </span>


            <div
                id="searchResults"
                class="search-results"
            ></div>

        </div>


    </div>


    <!-- =====================================
         PDF
    ====================================== -->

    <div
        id="pdfContainer"
        class="pdf-container"
    >

        <div class="loading">

            <div class="spinner"></div>

            Loading menu...

        </div>

    </div>



    <script>

        /*
         * ============================================
         * SETTINGS
         * ============================================
         */


        // Your exact PDF filename

        const PDF_URL =
            "New gurudev menucard bota.pdf";


        // PDF.js worker

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


        /*
         * Store extracted page information
         */

        let pdfDocument = null;

        let pages = [];


        /*
         * ============================================
         * NORMALIZE TEXT
         * ============================================
         */

        function normalizeText(text) {

            return text

                .replace(/\s+/g, " ")

                .trim()

                .toLowerCase();

        }


        /*
         * ============================================
         * LOAD PDF
         * ============================================
         */

        async function loadPDF() {

            const container =
                document.getElementById(
                    "pdfContainer"
                );


            try {

                /*
                 * Load PDF
                 */

                pdfDocument =
                    await pdfjsLib.getDocument(
                        PDF_URL
                    ).promise;


                /*
                 * Clear loading message
                 */

                container.innerHTML = "";


                /*
                 * Load every page
                 */

                for (
                    let pageNumber = 1;
                    pageNumber <= pdfDocument.numPages;
                    pageNumber++
                ) {

                    await renderPage(
                        pageNumber
                    );

                }


                console.log(
                    "PDF loaded:",
                    pdfDocument.numPages,
                    "pages"
                );


            } catch (error) {

                console.error(
                    "PDF error:",
                    error
                );


                container.innerHTML = `

                    <div class="loading">

                        ❌ Unable to load menu.

                        <br><br>

                        Please make sure the PDF file is in
                        the same folder as menu.html.

                    </div>

                `;

            }

        }


        /*
         * ============================================
         * RENDER PAGE
         * ============================================
         */

        async function renderPage(pageNumber) {

            const page =
                await pdfDocument.getPage(
                    pageNumber
                );


            /*
             * Scale the PDF page
             */

            const viewport =
                page.getViewport({
                    scale: 1.5
                });


            /*
             * Page wrapper
             */

            const pageDiv =
                document.createElement("div");


            pageDiv.className =
                "pdf-page";


            pageDiv.id =
                `page-${pageNumber}`;


            /*
             * Canvas
             */

            const canvas =
                document.createElement(
                    "canvas"
                );


            const context =
                canvas.getContext("2d");


            canvas.width =
                viewport.width;


            canvas.height =
                viewport.height;


            pageDiv.appendChild(
                canvas
            );


            /*
             * Page number
             */

            const pageNumberDiv =
                document.createElement(
                    "div"
                );


            pageNumberDiv.className =
                "page-number";


            pageNumberDiv.innerText =
                `Page ${pageNumber}`;


            pageDiv.appendChild(
                pageNumberDiv
            );


            /*
             * Text layer
             */

            const textLayer =
                document.createElement(
                    "div"
                );


            textLayer.className =
                "text-layer";


            pageDiv.appendChild(
                textLayer
            );


            /*
             * Add page to website
             */

            document
                .getElementById(
                    "pdfContainer"
                )
                .appendChild(
                    pageDiv
                );


            /*
             * Render canvas
             */

            await page.render({

                canvasContext:
                    context,

                viewport:
                    viewport

            }).promise;


            /*
             * Extract text
             */

            const textContent =
                await page.getTextContent();


            /*
             * Build text string
             */

            const text =
                textContent.items
                    .map(item => item.str)
                    .join(" ");


            /*
             * Store page data
             */

            pages.push({

                pageNumber:
                    pageNumber,

                text:
                    text,

                normalized:
                    normalizeText(text)

            });

        }


        /*
         * ============================================
         * SEARCH
         * ============================================
         */

        function searchMenu() {

            const input =
                document.getElementById(
                    "searchBox"
                );


            const results =
                document.getElementById(
                    "searchResults"
                );


            const query =
                normalizeText(
                    input.value
                );


            /*
             * Empty search
             */

            if (!query) {

                results.style.display =
                    "none";

                results.innerHTML =
                    "";

                clearHighlights();

                return;

            }


            /*
             * Search pages
             */

            const matches =
                pages.filter(page =>
                    page.normalized.includes(
                        query
                    )
                );


            results.innerHTML =
                "";


            /*
             * No matches
             */

            if (matches.length === 0) {

                results.innerHTML = `

                    <div class="no-result">

                        ❌ No results found

                        <br>

                        Try another food name.

                    </div>

                `;

                results.style.display =
                    "block";

                return;

            }


            /*
             * Display results
             */

            matches.forEach(
                page => {

                    const result =
                        document.createElement(
                            "div"
                        );


                    result.className =
                        "search-result";


                    result.innerHTML = `

                        <div class="result-page">

                            📄 Page ${page.pageNumber}

                        </div>

                        <div class="result-text">

                            ${createSnippet(
                                page.text,
                                query
                            )}

                        </div>

                    `;


                    /*
                     * Click result
                     */

                    result.addEventListener(
                        "click",
                        function() {

                            goToPage(
                                page.pageNumber
                            );

                            results.style.display =
                                "none";

                        }
                    );


                    results.appendChild(
                        result
                    );

                }
            );


            results.style.display =
                "block";


            /*
             * Highlight search
             */

            highlightPages(query);

        }


        /*
         * ============================================
         * CREATE SEARCH SNIPPET
         * ============================================
         */

        function createSnippet(
            text,
            query
        ) {

            const lower =
                text.toLowerCase();


            const position =
                lower.indexOf(
                    query.toLowerCase()
                );


            if (position === -1) {

                return escapeHTML(
                    text.substring(0, 180)
                );

            }


            const start =
                Math.max(
                    0,
                    position - 70
                );


            const end =
                Math.min(
                    text.length,
                    position +
                    query.length +
                    100
                );


            let snippet =
                text.substring(
                    start,
                    end
                );


            /*
             * Escape HTML
             */

            snippet =
                escapeHTML(
                    snippet
                );


            /*
             * Highlight query
             */

            const escapedQuery =
                escapeRegex(query);


            const regex =
                new RegExp(
                    `(${escapedQuery})`,
                    "gi"
                );


            snippet =
                snippet.replace(
                    regex,
                    "<strong>$1</strong>"
                );


            if (start > 0) {

                snippet =
                    "... " + snippet;

            }


            if (end < text.length) {

                snippet +=
                    " ...";

            }


            return snippet;

        }


        /*
         * ============================================
         * HIGHLIGHT PDF PAGES
         * ============================================
         *
         * The PDF is rendered as canvas.
         * We therefore use the page search result
         * to navigate to the correct page.
         *
         * ============================================
         */

        function highlightPages(query) {

            /*
             * Remove old highlights
             */

            clearHighlights();

        }


        function clearHighlights() {

            /*
             * Nothing required here because
             * PDF pages are rendered on canvas.
             */

        }


        /*
         * ============================================
         * GO TO PAGE
         * ============================================
         */

        function goToPage(pageNumber) {

            const page =
                document.getElementById(
                    `page-${pageNumber}`
                );


            if (!page) {

                return;

            }


            page.scrollIntoView({

                behavior: "smooth",

                block: "start"

            });


            /*
             * Brief visual indication
             */

            page.style.outline =
                "4px solid #FF9800";


            setTimeout(
                function() {

                    page.style.outline =
                        "";

                },
                1800
            );

        }


        /*
         * ============================================
         * ESCAPE REGEX
         * ============================================
         */

        function escapeRegex(text) {

            return text.replace(
                /[.*+?^${}()|[\]\\]/g,
                "\\$&"
            );

        }


        /*
         * ============================================
         * ESCAPE HTML
         * ============================================
         */

        function escapeHTML(text) {

            return text

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /*
         * ============================================
         * BACK BUTTON
         * ============================================
         */

        function goBack() {

            window.location.href =
                "index.html";

        }


        /*
         * ============================================
         * SEARCH EVENT
         * ============================================
         */

        document
            .getElementById(
                "searchBox"
            )
            .addEventListener(
                "input",
                searchMenu
            );


        /*
         * Close search results when
         * clicking outside
         */

        document.addEventListener(
            "click",
            function(event) {

                const wrapper =
                    document.querySelector(
                        ".search-wrapper"
                    );


                if (
                    !wrapper.contains(
                        event.target
                    )
                ) {

                    document
                        .getElementById(
                            "searchResults"
                        )
                        .style.display =
                            "none";

                }

            }
        );


        /*
         * ============================================
         * START
         * ============================================
         */

        loadPDF();

    </script>

</body>

</html>
